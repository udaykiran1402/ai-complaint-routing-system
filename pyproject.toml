
[project]
name = "ai-complaint-routing-system"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "nltk>=3.8.0",
    "langdetect>=1.0.9",
    "joblib>=1.3.0",
    "torch>=2.0.0",
    "openai-whisper>=20231117",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "app.web_app:app"
