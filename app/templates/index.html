<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Auto-Routing System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(74, 144, 226, 0.3), transparent 50%);
            pointer-events: none;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: -1px;
        }
        
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 40px;
            font-size: 1.1em;
            font-weight: 500;
        }
        
        .input-section {
            margin-bottom: 35px;
        }
        
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        textarea {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            min-height: 140px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        input[type="file"] {
            width: 100%;
            padding: 20px;
            border: 3px dashed #d0d0d0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        input[type="file"]:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            letter-spacing: 0.5px;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
        }
        
        button[type="submit"]:active {
            transform: translateY(0);
        }
        
        button[type="submit"]:disabled {
            background: linear-gradient(135deg, #ccc 0%, #999 100%);
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            display: none;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading p {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }
        
        .result {
            display: none;
            margin-top: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-section {
            margin-bottom: 25px;
        }
        
        .result-section h3 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            font-size: 1.3em;
            font-weight: 700;
        }
        
        .result-item {
            padding: 18px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-left: 5px solid #667eea;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .result-item:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        
        .priority-high { 
            border-left-color: #e74c3c;
            background: linear-gradient(135deg, #ffe5e5 0%, #ffc9c9 100%);
        }
        .priority-medium { 
            border-left-color: #f39c12;
            background: linear-gradient(135deg, #fff4e5 0%, #ffe0b3 100%);
        }
        .priority-low { 
            border-left-color: #27ae60;
            background: linear-gradient(135deg, #e8f8f5 0%, #c8e6c9 100%);
        }
        
        .similar-complaint {
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }
        
        .similar-complaint:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }
        
        .error {
            display: none;
            padding: 18px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border-radius: 12px;
            margin-top: 25px;
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.3);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Complaint Auto-Routing System</h1>
        <p class="subtitle">AI-powered complaint processing with local models</p>
        
        <form id="complaintForm">
            <div class="input-section">
                <div class="tabs">
                    <button type="button" class="tab active" data-tab="text">📝 Text</button>
                    <button type="button" class="tab" data-tab="audio">🎤 Audio</button>
                    <button type="button" class="tab" data-tab="video">🎥 Video</button>
                </div>
                
                <div id="text-tab" class="tab-content active">
                    <textarea name="text" placeholder="Enter your complaint here..."></textarea>
                </div>
                
                <div id="audio-tab" class="tab-content">
                    <input type="file" name="audio" accept="audio/*">
                </div>
                
                <div id="video-tab" class="tab-content">
                    <input type="file" name="video" accept="video/*">
                </div>
            </div>
            
            <button type="submit">Process Complaint</button>
        </form>
        
        <div class="loading">
            <div class="spinner"></div>
            <p>Processing your complaint...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <div class="result-section">
                <h3>💬 Complaint Text</h3>
                <div class="result-item" id="complaintText"></div>
            </div>
            
            <div class="result-section">
                <h3>👤 Assigned Officer</h3>
                <div class="result-item" id="officer"></div>
            </div>
            
            <div class="result-section">
                <h3>⚠️ Priority Level</h3>
                <div class="result-item" id="priority"></div>
            </div>
            
            <div class="result-section">
                <h3>⏱️ Estimated Resolution Time</h3>
                <div class="result-item" id="eta"></div>
            </div>
            
            <div class="result-section">
                <h3>🔍 Similar Past Complaints</h3>
                <div id="similarComplaints"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });
        
        // Form submission
        document.getElementById('complaintForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const loading = document.querySelector('.loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            
            // Hide previous results and clear content
            result.style.display = 'none';
            error.style.display = 'none';
            loading.style.display = 'block';
            
            // Clear previous result content
            document.getElementById('complaintText').textContent = '';
            document.getElementById('officer').innerHTML = '';
            document.getElementById('priority').innerHTML = '';
            document.getElementById('eta').innerHTML = '';
            document.getElementById('similarComplaints').innerHTML = '';
            
            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Processing failed');
                }
                
                // Display results
                displayResults(data);
                
            } catch (err) {
                error.textContent = '❌ Error: ' + err.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });
        
        function displayResults(data) {
            // Complaint text with input type badge
            const inputTypeBadge = data.input_type === 'audio' ? '🎤 AUDIO' : 
                                   data.input_type === 'video' ? '🎥 VIDEO' : '📝 TEXT';
            document.getElementById('complaintText').innerHTML = `
                <span style="display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                      color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; 
                      margin-bottom: 8px;">${inputTypeBadge}</span><br>
                ${data.complaint_text}
            `;
            
            // Officer
            document.getElementById('officer').innerHTML = `
                <strong>${data.officer.name}</strong><br>
                Confidence: ${(data.officer.confidence * 100).toFixed(1)}%
            `;
            
            // Priority
            const priorityDiv = document.getElementById('priority');
            priorityDiv.innerHTML = `
                <strong>${data.priority.level}</strong><br>
                Confidence: ${(data.priority.confidence * 100).toFixed(1)}%
            `;
            priorityDiv.className = 'result-item priority-' + data.priority.level.toLowerCase();
            
            // ETA
            document.getElementById('eta').innerHTML = `
                <strong>${data.eta.days} days</strong><br>
                ${data.eta.description}
            `;
            
            // Similar complaints
            const similarDiv = document.getElementById('similarComplaints');
            if (data.similar_complaints && data.similar_complaints.length > 0) {
                similarDiv.innerHTML = data.similar_complaints.map((c, i) => `
                    <div class="similar-complaint">
                        <strong>#${i + 1}</strong> - Similarity: ${(c.similarity_score * 100).toFixed(1)}%<br>
                        ${c.text}<br>
                        <small>Status: ${c.status}</small>
                    </div>
                `).join('');
            } else {
                similarDiv.innerHTML = '<p>No similar complaints found</p>';
            }
            
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
